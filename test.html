<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Excel Server Test</title>

    <style>
        body {
            font-family: Arial;
            width: 500px;
            margin: 40px auto;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 25px;
            cursor: pointer;
        }

        pre {
            background: #eee;
            padding: 15px;
            white-space: pre-wrap;
        }
    </style>

</head>

<body>

    <h2>Excel Server Test</h2>

    <input type="file" id="file">

    <input type="text" id="date" placeholder="18-07-2026">

    <input type="text" id="dsf" placeholder="M.Yaseen">

    <input type="number" id="todayValue" placeholder="50000">

    <button onclick="upload()">

        Update Workbook

    </button>

    <pre id="result"></pre>

    <script>

        async function upload() {

            const file = document.getElementById("file").files[0];

            if (!file) {

                alert("Select Excel File");

                return;

            }

            const form = new FormData();

            form.append("file", file);

            form.append(
                "date",
                document.getElementById("date").value
            );

            form.append(
                "dsf",
                document.getElementById("dsf").value
            );

            form.append(
                "todayValue",
                document.getElementById("todayValue").value
            );

            const res = await fetch(

                "http://localhost:3000/api/excel/update",

                {

                    method: "POST",

                    body: form

                }

            );

            const json = await res.json();

            document.getElementById("result").textContent =

                JSON.stringify(json, null, 2);

        }

    </script>

</body>

</html>
